<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Flavicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VoteWise - Your nonpartisan voting companion. Check eligibility, find representatives, and get AI-powered voting guidance." />
    <meta name="theme-color" content="#1e40af" />
    <title>VoteWise - Your Voting Companion</title>
    <script>
      // Prevent flash of wrong theme
      (function() {
        var saved = localStorage.getItem('votewise-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
